<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
 
    <title>BP Hoche</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, Helvetica, sans-serif;
            color: white;

            background:
                radial-gradient(circle at 50% 40%, #202020 0%, #0d0d0d 45%, #050505 100%);

            overflow: hidden;
        }

        
        body::before {
            content: "";
            position: absolute;
            width: 500px;
            height: 500px;
            background: rgba(255, 255, 255, 0.04);
            filter: blur(100px);
            border-radius: 50%;
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 1;
            padding: 30px;
        }

        h1 {
            font-size: clamp(2.2rem, 6vw, 5rem);
            font-weight: 600;
            letter-spacing: -2px;
        }

        .dots {
            display: inline-block;
            width: 1.5em;
            text-align: left;
        }

        .dots span {
            opacity: 0;
            animation: dots 1.5s infinite;
        }

        .dots span:nth-child(1) {
            animation-delay: 0s;
        }

        .dots span:nth-child(2) {
            animation-delay: 0.25s;
        }

        .dots span:nth-child(3) {
            animation-delay: 0.5s;
        }

        @keyframes dots {
            0%, 20% {
                opacity: 0;
            }

            50%, 100% {
                opacity: 1;
            }
        }

        .brand {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);

            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;

            color: #777;
        }

        @media (max-width: 600px) {
            h1 {
                letter-spacing: -1px;
            }

            .brand {
                bottom: 20px;
            }
        }
    </style>
</head>

<body>

    <main class="container">
        <h1>
            Something big is coming here
            <span class="dots">
                <span>.</span>
                <span>.</span>
                <span>.</span>
            </span>
        </h1>
    </main>

    <div class="brand">
        BP Hoche
    </div>

</body>
</html>
